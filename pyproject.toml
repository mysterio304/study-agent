[project]
name = "study-agent"
version = "0.1.0"
description = "Personal AI study agent: Telegram + Canvas LMS + finals planner"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.10.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "time-machine>=3.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["agent/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in user-facing strings is intentional

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # the formatter wraps code at 100; long user-facing strings may reach 120

[tool.ruff.lint.per-file-ignores]
"agent/brain/context.py" = ["E501"]  # system prompt prose is kept as natural paragraphs

[tool.coverage.run]
source = ["agent"]
omit = ["agent/db/migrations/*", "agent/__main__.py"]
